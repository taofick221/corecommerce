name: CoreCommerce CI

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python Version
        run: python --version

      - name: Show Current Directory
        run: pwd

      - name: List Project Files
        run: ls -la

      - name: Print Message
        run: echo "Hello CoreCommerce CI"